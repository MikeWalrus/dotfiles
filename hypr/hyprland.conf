#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#
group {
    groupbar {
        font_family = sans-serif Bold
        render_titles = true
        font_size = 13
    }
}

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = hyprpaper
exec-once = hyprctl setcursor Adwaita 30
exec-once = /home/mike/repos/third-party/mako/build/mako
exec-once = waybar
exec-once = fcitx5
# exec-once = tmux_clash
exec-once = swayidle
exec-once = run_while_wayland.sh inhibit-lock-release-loop.py
exec-once = wlsunset -l 39.9 -L 116.3 -t 5500
exec-once = sleep 1 && set_wallpaper.sh
exec-once = run_while_wayland.sh change-color-scheme.sh
exec-once = hyprland-autoname-workspaces
exec-once = run_while_wayland.sh sway-audio-idle-inhibit
exec-once = ianny
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Some default env vars.
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XIM_PROGRAM,fcitx

env = XIM,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,"@im=fcitx"
env = GTK_IM_MODULE,

env = XCURSOR_SIZE,30
env = HYPRCURSOR_SIZE,30

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/

binds {
    scroll_event_delay = 10
}

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = yes
        scroll_factor = 0.7
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 1
    gaps_out = 0
    border_size = 3
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle
    resize_on_border = true
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    rounding = 2
    blur {
        size = 5
        passes = 4
        new_optimizations = true
    }

    drop_shadow = yes
    shadow_range = 50
    shadow_render_power = 3
    col.shadow = rgba(00000050)
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more
    animation = windows, 1, 2, default
    animation = windowsOut, 1, 2, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 20, default, once
    animation = fade, 1, 5, default
    animation = workspaces, 1, 6, default
    animation = layers, 0
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_is_master = true
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    workspace_swipe = true
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
# device:epic-mouse-v1 {
#     sensitivity = -0.5
# }

misc {
    disable_hyprland_logo = true
    focus_on_activate = true
    allow_session_lock_restore = true
    new_window_takes_over_fullscreen = 2
}

cursor {
    zoom_rigid = false
    zoom_factor = 1.0
}

XWayland {
#    force_zero_scaling = true
}

layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, lockscreen
layerrule = blur, notifications
layerrule = blur, rofi
layerrule = ignorezero, rofi

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrule = noblur, zoom
windowrule = noborder, zoom
windowrule = float, kylin-virtual-keyboard
windowrule = nofocus, kylin-virtual-keyboard

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, alacritty
bind = $mainMod, D, exec, rofi -show combi -modes combi -combi-modes "window,drun,run"
bind = $mainMod SHIFT, D, exec, rofi -show drun
bind = $mainMod, b, exec, firefox
bind = $mainMod, u, exec, systemctl suspend
bind = $mainMod ALT, l, exec, loginctl lock-session
binde = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
binde = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
binde = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
# binde = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SINK@ toggle
binde = , XF86MonBrightnessUp, exec, brillo -e -q -A 5 -u 100000
binde = , XF86MonBrightnessDown, exec, brillo -e -q -U 5 -u 100000
bind = $mainMod SHIFT, n, exec, makoctl restore
bind = $mainMod, n, exec, makoctl dismiss
bind = $mainMod ALT, n, exec, mako-toggle
bind = $mainMod SHIFT, s, exec, grimblast copysave area ~/screen.png
bind = , Print, exec, grimblast copysave area ~/screen.png
bind = $mainMod, x, exec, sxiv ~/screen.png
bind = $mainMod SHIFT, x, exec, emacsclient -nc -a ""
bind = $mainMod, comma, exec, rofi -show window
bind = $mainMod SHIFT, o, exec, ocr_screen.sh
bind = $mainMod , g, exec, goldendict

bind = $mainMod, v, exec, killall -SIGUSR1 waybar

bind = $mainMod SHIFT, Q, killactive, 
# bind = $mainMod SHIFT, E, exit,
bind = $mainMod SHIFT, SPACE, togglefloating, 
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, E, togglesplit, # dwindle
bind = $mainMod, F, fullscreen
bind = $mainMod, t, togglegroup
bind = $mainMod, minus, exec, scratchpad
bind = $mainMod SHIFT, minus, exec, scratchpad -g

# Move focus with mainMod + arrow keys
bind = $mainMod, left, exec, hyprland-move.sh focus l
bind = $mainMod, right, exec, hyprland-move.sh focus r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, h, exec, hyprland-move.sh focus l
bind = $mainMod, l, exec, hyprland-move.sh focus r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d
bind = $mainMod, m, movecurrentworkspacetomonitor, +1

bind = $mainMod SHIFT, left, exec, hyprland-move.sh move l
bind = $mainMod SHIFT, right, exec, hyprland-move.sh move r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, h, exec, hyprland-move.sh move l
bind = $mainMod SHIFT, l, exec, hyprland-move.sh move r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, o, workspace, previous

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Scroll to zoom
bind = $mainMod SHIFT, mouse_down, exec, hyprland-zoom.zsh +0.2
bind = $mainMod SHIFT, mouse_up, exec, hyprland-zoom.zsh -0.2

# Pin the floating window
bind = $mainMod SHIFT, p, pin

# exec-once = hyprpm reload -n && hyprctl reload
source = ~/.config/hypr/monitors.conf

