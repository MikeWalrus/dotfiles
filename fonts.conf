<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
 <match target="pattern">
  <test name="family" qual="any">
   <string>monospace</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>JetBrains Mono</string>
   <string>文泉驿等宽微米黑</string>
   <string>Twemoji</string>
   <string>Font Awesome 6 Free</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>serif</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>New York Small</string>
   <string>思源宋体 CN</string>
   <string>Twemoji</string>
   <string>Font Awesome 6 Free</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>sans-serif</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>SF Pro Text</string>
   <string>思源黑体 CN</string>
   <string>Twemoji</string>
   <string>Font Awesome 6 Free</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family">
   <string>黑体</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>思源黑体 CN</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family">
   <string>宋体</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>思源宋体 CN</string>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>rgb</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
</fontconfig>
