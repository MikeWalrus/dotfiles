import = ["~/.config/alacritty/color.toml"]

[colors.selection]
background = "CellForeground"
text = "CellBackground"

[env]
TERM = "xterm-256color"

[font.normal]
family = "monospace"
style = "Medium"

[font]
size = 18.0

[window]
decorations = "none"
blur = true

[[hints.enabled]]
command = "uri_copy"
hyperlinks = true
post_processing = true
persist = false
binding = { key = "y", mods = "Control|Shift" }
mouse = { enabled = true, mods = "Control" }
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩‘]+"

[[hints.enabled]]
command         = "xdg-open"
hyperlinks      = true
post_processing = true
persist         = false
mouse.enabled   = true
binding         = { key = "o", mods = "Control|Shift" } # o for open
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩‘]+"
