version = "1.1.13"

[class]
QQ = ""
libreoffice-writer = ""
"com.github.xournalpp.xournalpp" = ""
DEFAULT = "{class}"
GoldenDict = "📙"
Gvim = "🇻"
TelegramDesktop = "✈️"
"[Ff]irefox" = ""
"org.gnome.Nautilus" = ""
"(?i)waydroid.*" = "droid"
"org.gnome.Contacts" = ""
Anki = "📇"
emacs = "😈"
"(?i)Kitty" = "term"
Sxiv = "🖼️"
Zotero = "Z"
"org.pwmt.zathura" = ""
thunderbird = ""
Brave-browser = "🌍"
Alacritty = ""
"org.telegram.desktop" = ""

[class_active]
# "(?i)ExampleOneTerm" = "<span foreground='red'>{icon}</span>"
# DEFAULT = "*{icon}*"

[initial_class]

[initial_class_active]

[workspaces_name]
4 = "four"
5 = "five"
6 = "six"
2 = "two"
10 = "ten"
0 = "zero"
1 = "one"
7 = "seven"
3 = "three"
8 = "eight"
9 = "nine"

[title_in_class.firefox]
".*Apple Music.*" = ""

[title_in_class."(?i)kitty"]
"(?i)neomutt" = "neomutt"

[title_in_class_active."(?i)firefox"]
"(?i)twitch" = "<span color='purple'>{icon}</span>"

[title_in_initial_class]

[title_in_initial_class_active]

[initial_title_in_class]

[initial_title_in_class_active]

[initial_title_in_initial_class]

[initial_title_in_initial_class_active]

[exclude]
"ueberzugpp*" = ""
aProgram = "^$"
"" = "^$"
"(?i)fcitx" = ".*"
"[Ss]team" = "^(Friends List.*)?$"
"(?i)TestApp" = ""

[format]
dedup = true
dedup_inactive_fullscreen = false
delim = " "
workspace = "<span color='#C3E88D'>{id}:</span>{delim}{clients}"
workspace_empty = "{id}"
client = "{icon}"
client_fullscreen = "[{icon}]"
client_active = "<span color='#C3E88D'>{icon}</span>"
client_dup = "{icon}{counter_sup}"
client_dup_active = "*{icon}*{delim}{icon}{counter_unfocused_sup}"
client_dup_fullscreen = "[{icon}]{delim}{icon}{counter_unfocused_sup}"
