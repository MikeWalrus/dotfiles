- defaults:
    link:
      relink: true

- clean: ['~']

- create:
    - ~/.config/alacritty

- link:
    ~/.vimrc: vimrc
    ~/.gvimrc: gvimrc
    ~/.zshrc: zshrc
    ~/.config/i3/config: i3 
    ~/.config/tmux/tmux.conf: tmux.conf
    ~/.config/i3status/config: i3status
    ~/.config/picom/picom.conf: picom.conf
    ~/.config/alacritty/alacritty.yml: alacritty/alacritty.yml
    ~/.config/alacritty/alacritty.toml: alacritty/alacritty.toml
    ~/.config/alacritty/light.toml: alacritty/light.toml
    ~/.config/alacritty/dark.toml: alacritty/dark.toml
    ~/.config/sxiv/exec: sxiv
    ~/.config/dunst/dunstrc: dunstrc
    ~/.doom.d: doom
    ~/.config/lf: lf
    ~/.config/nvim/init.vim: nvim.vim
    ~/.config/i3wsr/config.toml: i3wsr.toml
    ~/.config/mpv: mpv
    ~/.config/paru/paru.conf: paru.conf
    ~/.config/rofi/config.rasi: rofi.rasi
    ~/.config/xmobar/xmobarrc: xmobarrc
    ~/.config/xmonad/xmonad.hs: xmonad.hs
    ~/.config/sway/config: sway
    ~/.xinitrc: xinitrc
    ~/.Xresources: Xresources
    ~/.config/fontconfig/fonts.conf: fonts.conf
    ~/.config/i3blocks: i3blocks
    ~/.config/brave-flags.conf: brave-flags.conf
    ~/.config/hypr: hypr
    ~/.config/waybar: waybar
    ~/.config/swaylock: swaylock
    ~/.config/swayidle: swayidle
    ~/.config/wofi: wofi
    ~/.config/mako: mako
    ~/.local/bin/:
        glob: true
        path: bin/*
    ~/.config/nvchecker: nvchecker
    ~/.config/bat/config: bat.config
    ~/.config/hyprland-autoname-workspaces : hyprland-autoname-workspaces
    ~/.config/xdg-desktop-portal: xdg-desktop-portal
    ~/.config/latexmk/latexmkrc: latexmkrc
    ~/.config/systemd/user/:
        glob: true
        path: systemd/user/*
    ~/.config/environment.d: environment.d
