- defaults:
    link:
      relink: true

- clean: ['~']

- link:
    ~/.vimrc: vimrc
    ~/.gvimrc: gvimrc
    ~/.zshrc: zshrc
    ~/.config/i3/config: i3 
    ~/.tmux.conf: tmux.conf
    ~/.config/i3status/config: i3status
    ~/.config/picom/picom.conf: picom.conf
    ~/.config/alacritty/alacritty.yml: alacritty.yml
    ~/.config/sxiv/exec: sxiv
    ~/.config/dunst/dunstrc: dunstrc
    ~/.doom.d: doom
