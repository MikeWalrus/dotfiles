- defaults:
    link:
      relink: true

- clean: ['~']

- link:
    ~/.vimrc: vimrc
    ~/.zshrc: zshrc
    ~/.config/i3/config: i3 
    ~/.tmux.conf: tmux.conf
    ~/.config/i3status/config: i3status
    ~/.config/picom/picom.conf: picom.conf
    ~/.config/alacritty/alacritty.yml: alacritty.yml
    ~/.config/sxiv/exec/image-info: 
      create: true
      path: image-info.sh
    ~/.config/fcitx5/conf/classicui.conf: fcitx5_classicui.conf
    ~/.config/dunst/dunstrc: dunstrc
    ~/.doom.d/config.el: doom/config.el
    ~/.doom.d/init.el: doom/init.el
    ~/.doom.d/packages.el: doom/packages.el
